version: '3.8'

services:
  web:
    build: .
    container_name: mitigasi_web
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      # String koneksi database untuk dipakai di app.py
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://admin:rahasia123@db/mitigasi_db
      - FLASK_ENV=production

  db:
    image: mysql:8.0
    container_name: mitigasi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mitigasi_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: rahasia123
    ports:
      - "3306:3306"
    volumes:
      # Menyimpan data database secara permanen agar tidak hilang saat container mati
      - db_data:/var/lib/mysql

volumes:
  db_data: